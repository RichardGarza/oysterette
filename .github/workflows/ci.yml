name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oysterette_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/oysterette_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/oysterette_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Apply migrations to test database
        run: npx prisma migrate deploy
      # Serial: suites share one test database, parallel workers race on its state
      - name: Run tests
        run: npm test -- --runInBand
      - name: Build
        run: npx tsc --project tsconfig.build.json

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/web-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/web-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      # Non-blocking: 101 pre-existing errors (mostly no-explicit-any) as of Jul 2026.
      # Burn them down, then remove continue-on-error to make lint a gate.
      - name: Run ESLint
        run: npm run lint
        continue-on-error: true
      - name: Run Jest tests
        run: npm test
      - name: Build
        run: npm run build

  # E2E hits the live Railway backend (which auto-sleeps), so it is manual-only
  # to keep push/PR CI deterministic. Run via the Actions tab when needed.
  e2e:
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/web-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/web-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npx playwright test --project=chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: backend/web-app/playwright-report/
          retention-days: 30
